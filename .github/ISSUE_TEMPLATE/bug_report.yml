name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you provide, the faster it gets fixed.

  - type: input
    id: version
    attributes:
      label: claude-kit version
      placeholder: "e.g. 0.4.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (AppImage)
        - Linux (.deb)
        - Linux (.rpm)
    validations:
      required: true

  - type: dropdown
    id: ai_backend
    attributes:
      label: AI backend (Settings → AI)
      description: Which backend is configured when the bug occurs?
      options:
        - Claude CLI (auto-detected)
        - Claude CLI (custom path)
        - API (OpenAI-compatible)
        - None / not configured
        - Not relevant to this bug
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error message or logs
      description: |
        Open the dev console with **Ctrl+Shift+I** (Windows/Linux) or **Cmd+Opt+I** (macOS) and paste any relevant errors here.
      render: text
