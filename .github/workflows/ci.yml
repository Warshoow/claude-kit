name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx vue-tsc --noEmit

  cargo-check:
    name: Cargo check
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cargo check
        # `--no-default-features` disables the `custom-protocol` feature in
        # claude-kit-app, whose proc macro otherwise insists that
        # `frontendDist: "../dist"` exists at compile time. The release
        # workflow builds the frontend first via tauri-action, so the strict
        # path is still exercised on tag pushes. `--workspace` covers all
        # three crates: claude-kit-core, claude-kit-cli, and claude-kit-app.
        run: cargo check --workspace --no-default-features
