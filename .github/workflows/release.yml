name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
            cli_src: target/release/ck
            cli_name: ck-linux-x86_64
          - platform: windows-latest
            args: ''
            cli_src: target/release/ck.exe
            cli_name: ck-windows-x86_64.exe
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            cli_src: target/aarch64-apple-darwin/release/ck
            cli_name: ck-macos-arm64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            cli_src: target/x86_64-apple-darwin/release/ck
            cli_name: ck-macos-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # In-app updater signing. When these secrets are set, tauri-action
          # signs the release artefacts and uploads a `latest.json` manifest
          # alongside them — which is what the updater plugin reads. When
          # the secrets are missing, the build still succeeds but no signed
          # artefacts are produced; auto-update simply won't work for that
          # release. See docs/release.md for the one-time setup.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'claude-kit ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build and upload CLI binary
        # The Tauri build above already compiled claude-kit-core; Cargo
        # only needs to link the thin CLI binary here, so this is fast.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cargo build --release -p claude-kit-cli ${{ matrix.args }}
          cp "${{ matrix.cli_src }}" "${{ matrix.cli_name }}"
          gh release upload "${{ github.ref_name }}" "${{ matrix.cli_name }}" --clobber
