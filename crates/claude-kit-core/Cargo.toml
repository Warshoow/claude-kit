[package]
name = "claude-kit-core"
version = "0.4.1"
edition = "2021"

[lib]
name = "claude_kit_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gray_matter = "0.2"
dirs = "5"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tar = "0.4"
flate2 = "1"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
